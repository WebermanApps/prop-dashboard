const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const esc=t=>String(t);
/* Condensed rows: one compact row each (2-line clamp, tap to expand), right-aligned date, first 5 then See All. */
function rows(items,cls){const n=items.length;return `<ul class="rows ${cls||''}">${items.map((it,i)=>`<li${i>=5?' class="extra"':''}><button class="row" aria-expanded="false"><span class="rt">${it[0]}</span>${it[1]?`<span class="rd${it[2]?' pill due':''}">${it[1]}</span>`:''}</button></li>`).join('')}</ul>${n>5?`<button class="seeall mw-hover" aria-expanded="false" data-n="${n}">See All ${n}</button>`:''}`}
document.addEventListener('click',e=>{const r=e.target.closest('.row');if(r){r.setAttribute('aria-expanded',r.getAttribute('aria-expanded')!=='true');return}
 const a=e.target.closest('.seeall');if(a){const u=a.previousElementSibling,on=u.classList.toggle('all');a.setAttribute('aria-expanded',on);a.textContent=on?'Show Fewer':'See All '+a.dataset.n}});
const T=document.getElementById('track'),TB=document.getElementById('tabs'),D=document.getElementById('dots');
PROPS.forEach((p,i)=>{
 const dec=p.decisions.map(d=>Array.isArray(d)?[d[0],'Due '+fmt(d[1]),1]:[d]);const due=p.decisions.filter(Array.isArray).length;
 const s=document.createElement('section');s.className='panel';s.id='panel-'+p.id;s.setAttribute('role','tabpanel');s.setAttribute('aria-label',p.name);
 s.innerHTML=`<div class="phead"><h2>${p.name}</h2><span class="pill st">${p.status}</span></div>
 <div class="fin" id="fin-${p.id}"><p class="muted">Loading numbers</p></div>
 <details class="drop items"><summary><span class="sumtxt"><b>Open Items · ${p.decisions.length}</b><span class="muted">${due?due+' due soon':'Tasks and recent work'}</span></span><span class="chev" aria-hidden="true"></span></summary>
 <div><h3 class="caps">To Do</h3>${rows(dec.slice(0,3).concat(dec.slice(3)))}<h3 class="caps">Recent Work</h3>${rows(p.work.map(w=>[w[1],w[0]]),'wk')}</div></details>`;
 T.appendChild(s);
 const b=document.createElement('button');b.className='tab mw-hover';b.role='tab';b.textContent=p.name;b.onclick=()=>go(i);TB.appendChild(b);
 const d=document.createElement('button');d.setAttribute('aria-label',p.name);d.onclick=()=>go(i);D.appendChild(d);
});

/* Finance (finance.json): big numbers, split bar, details view. est:true = star. */
const usd=v=>v==null?'Waiting':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
const star=e=>e?'<sup class="star" title="Estimated or waiting for records">*</sup>':'';
fetch('finance.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(F=>{for(const p of PROPS){const f=F.properties[p.id],el=document.getElementById('fin-'+p.id);if(!f||!el)continue;
 const exp=Math.min(100,Math.round(f.known_total/f.rent*100)),cf=100-exp,anyEst=f.expenses.some(x=>x.est);
 el.innerHTML=`<div class="bign"><div><span>Rent / Mo</span><b>${usd(f.rent)}</b></div><div><span>Cash Flow / Mo</span><b class="pos">${usd(f.cash_flow)}${star(f.cash_flow_est)}</b></div><div><span>Last Rent</span><b>${fmt(f.last_rent.date)}${star(f.last_rent.est)}</b></div></div>
 <div class="split" role="img" aria-label="Of ${usd(f.rent)} rent, known expenses ${usd(f.known_total)}, cash flow ${usd(f.cash_flow)}"><i class="ex" style="width:${exp}%"></i><i class="cf" style="width:${cf}%"></i></div>
 <div class="splitkey"><span><i class="ex"></i>Expenses ${usd(f.known_total)}${star(anyEst)}</span><span><i class="cf"></i>Cash Flow ${usd(f.cash_flow)}${star(f.cash_flow_est)}</span></div>
 <details class="drop findet"><summary><span class="sumtxt"><b>Financial Details</b><span class="muted">Expenses, sources, annual</span></span><span class="chev" aria-hidden="true"></span></summary><div>
 <table class="ft"><thead><tr><th>Monthly</th><th>Amount</th><th>Source</th></tr></thead><tbody>
 <tr><td>Rent</td><td>${usd(f.rent)}</td><td>Lease</td></tr>
 ${f.expenses.map(x=>`<tr><td>${x.label}<small class="src">${x.source}${x.as_of?' · '+fmt(x.as_of):''}</small></td><td>${usd(x.amount)}${star(x.est)}</td><td>${x.source}${x.as_of?' · '+fmt(x.as_of):''}</td></tr>`).join('')}
 <tr class="tot"><td>Known Expenses</td><td>${usd(f.known_total)}${star(anyEst)}</td><td></td></tr>
 <tr class="tot"><td>Cash Flow</td><td>${usd(f.cash_flow)}${star(f.cash_flow_est)}</td><td>Rent minus known expenses</td></tr></tbody></table>
 <h3 class="caps">Annual</h3><table class="ft"><tbody>
 <tr><td>Rent</td><td>${usd(f.rent*12)}</td><td>Monthly × 12</td></tr>
 <tr><td>Known Expenses</td><td>${usd(+(f.known_total*12).toFixed(2))}${star(1)}</td><td>Monthly × 12</td></tr>
 <tr class="tot"><td>Cash Flow</td><td>${usd(+(f.cash_flow*12).toFixed(2))}${star(1)}</td><td>Monthly × 12</td></tr></tbody></table>
 <h3 class="caps">Last Rent</h3><p class="fp">${f.last_rent.label}, ${fmt(f.last_rent.date)}${star(f.last_rent.est)}: ${f.last_rent.detail}</p>
 ${f.extra.map(x=>`<p class="fp"><b>${x.label}:</b> ${x.value} <span class="pill">${x.note}</span></p>`).join('')}
 ${f.notes.map(n=>`<p class="fp muted">${n}</p>`).join('')}
 <p class="legend">* Estimated or waiting for records</p></div></details>`}}).catch(()=>{});
const panels=[...T.children];let cur=0;const wide=()=>matchMedia('(min-width:1100px)').matches;
function mark(i){cur=i;[...TB.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));[...D.children].forEach((b,j)=>b.classList.toggle('on',j===i));panels.forEach((p,j)=>p.classList.toggle('active',j===i));
 const h='#'+PROPS[i].id;if(location.hash!==h)history.replaceState(null,'',h)}
function go(i,instant){i=(i+PROPS.length)%PROPS.length;mark(i);if(wide()){if(!instant)panels[i].scrollIntoView({block:'nearest',behavior:'smooth'})}else T.scrollTo({left:panels[i].offsetLeft-T.offsetLeft,behavior:instant?'instant':'smooth'})}
let st;T.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{if(wide())return;const i=Math.round(T.scrollLeft/T.clientWidth);if(i!==cur)mark(i)},60)});
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
const fromHash=()=>{const i=PROPS.findIndex(p=>'#'+p.id===location.hash);return i<0?0:i};
addEventListener('hashchange',()=>go(fromHash()));const mq=matchMedia('(min-width:1100px)');mq.addEventListener('change',()=>{T.scrollLeft=0;if(!mq.matches)go(cur,true)});addEventListener('resize',()=>{if(wide())T.scrollLeft=0;else go(cur,true)});
const init=fromHash();requestAnimationFrame(()=>go(init,true));addEventListener('load',()=>{if(cur===0&&init!==0)go(init,true)});
/* Updated time in the shared top bar */
const setUpd=iso=>{const d=new Date(iso);document.getElementById('upd').textContent='Updated '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'Asia/Bangkok'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Bangkok'})};
setUpd(BUILT);
/* Report: one summary line that expands (report.json). Notifications: report.json "notifications", max 2, right under the report. Empty = hidden. */
fetch('report.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(r=>{
 if(r.updated&&new Date(r.updated)>new Date(BUILT))setUpd(r.updated);
 const li=a=>rows(a.map(x=>[x]));let h='';
 if(r.text)h+=`<p>${r.text}</p>`;if(r.items)h+=li(r.items);if(r.groups)h+=r.groups.map(g=>`<details class="fold"><summary>${g.title} <span class="cnt">${g.items.length}</span></summary>${li(g.items)}</details>`).join('');
 if(h){document.getElementById('rtype').textContent='Morning Report'+(r.date?' · '+fmt(r.date):'');
  document.getElementById('rsum').textContent=r.summary||(r.groups?r.groups.map(g=>g.items.length+' '+g.title.toLowerCase()).join(' · '):r.items?r.items.length+' items':'');
  document.getElementById('rbody').innerHTML=h;document.getElementById('report').hidden=false}
 const N=(r.notifications||[]).slice(0,2),box=document.getElementById('notif');if(!N.length)return;box.hidden=false;
 document.getElementById('ncount').textContent='Notifications · '+N.length;
 document.getElementById('nfirst').textContent=N[0].short||N[0].text;
 const ic=n=>n.due?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>';
 document.getElementById('nlist').innerHTML=N.map(n=>`<li class="ntile"><span class="ico">${ic(n)}</span><span>${n.text}${n.due?` <span class="pill due">Due ${fmt(n.due)}</span>`:''}</span></li>`).join('');
}).catch(()=>{});
/* Week strip (deck pick 16 A): next 7 days, dots = routines that run that day. Built from the same schedule. */
(function(){const W=document.getElementById('week');if(!W)return;const now=new Date();let h='';
 for(let k=0;k<7;k++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k),dm=d.getDate(),t=[];
  t.push('<i class="r" title="Morning Report 4:43 AM"></i>');
  if(dm===2||dm===4)t.push('<i class="m" title="Rent receipts 6:28 PM"></i>');
  if(d.getMonth()===9&&dm===24&&d.getFullYear()===2026)t.push('<i class="e" title="USPS Wickfield check 5:23 PM"></i>');
  h+=`<div class="wd${k?'':' today'}"><small>${d.toLocaleDateString('en-US',{weekday:'short'})}</small><b>${dm}</b>${t.join('')}</div>`}
 W.innerHTML=h+'<div class="wkey"><span><i class="r" style="background:var(--lagoon)"></i>Morning Report</span><span><i style="background:var(--saffron)"></i>Rent Receipts</span><span><i style="background:var(--terra)"></i>USPS Check</span></div>'})();
document.getElementById('share').onclick=async()=>{const url=location.href,text='Prop Command Center';
 if(navigator.share){try{await navigator.share({title:text,text,url});return}catch(e){if(e.name==='AbortError')return}}
 if(/iPhone|iPad|Android/i.test(navigator.userAgent)){location.href='sms:?&body='+encodeURIComponent(text+' '+url);return}
 const b=document.getElementById('share');try{await navigator.clipboard.writeText(url);b.title='Copied'}catch(e){prompt('Copy link',url)}setTimeout(()=>b.title='Share',1800)};
</script><script src="ptr.js" defer></script>
