<!--mw-machan-pop v1--><style id="mwmp-css">.mwmp-bg{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(40,30,20,.28);-webkit-tap-highlight-color:transparent}

[data-mwmp]{cursor:pointer}
.mw-made{margin:6px 0 0;font-size:12px;letter-spacing:.02em;opacity:.62;font-weight:500}</style><script id="mwmp-js">(function(){if(window.__mwmp)return;window.__mwmp=1;var bg,card,last,q=0;

['click','pointerdown','pointerup','mousedown','mouseup','touchstart','touchend'].forEach(function(t){bg.addEventListener(t,function(e){e.stopPropagation();if(t==='click'&&(e.target===bg||e.target.closest('.mwmp-x'))){e.preventDefault();close()}},{passive:t.indexOf('touch')<0})})}
function open(e){if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}if(!bg)build();last=document.activeElement;bg.classList.add('on');card.querySelector('.mwmp-x').focus()}
