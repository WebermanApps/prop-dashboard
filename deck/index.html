<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light">
<title>Prop Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Khand:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-tokens.css">
<style>
:root{--bg:#FDFBF6;--lagoon:#05668D;--saffron:#D4A017;--lines:#E5E0D8}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--bg);color:var(--mw-foreground,#0a0a0a);font:400 16px/1.45 Hind,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:12px 16px 40px}
h1,h2{font-family:Khand,sans-serif;font-weight:700;margin:.2em 0;line-height:1.15}
h1{font-size:1.8rem}h2{font-size:1.35rem}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
a.back,button{min-height:44px;font:600 1rem Hind,sans-serif;border-radius:0;border:2px solid #171717;background:#fff;color:inherit;padding:0 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
a.back:hover,button:hover{transform:translateY(-1px)}
.card{background:#fff;border:1px solid var(--lines);border-left:4px solid var(--lagoon);border-radius:.75rem;padding:16px;margin:12px 0}
.cat{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--lagoon);font-weight:600}
.opts{display:grid;gap:8px;margin:12px 0}.opts button{justify-content:flex-start;text-align:left;border-radius:.5rem;border:1.5px solid var(--lines)}
.opts button.on{border-color:var(--lagoon);background:#eaf4f8}
textarea{width:100%;box-sizing:border-box;min-height:60px;font:1rem Hind,sans-serif;border:1px solid var(--lines);border-radius:10px;padding:8px;margin-top:4px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.prog{color:#525252;font-size:.9rem}#submitBox{margin:16px 0}
#sub{width:100%;min-height:52px;background:#171717;color:#fafafa;border:0;font:700 1.15rem Khand,sans-serif;letter-spacing:.08em;text-transform:uppercase;justify-content:center}
footer{text-align:center;color:#737373;margin-top:24px;font-size:.9rem}footer a{color:inherit;min-height:44px;display:inline-flex;align-items:center}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
</style></head><body><div class="w">
<div class="top"><a class="back" href="../#deck-launcher">Back to Deck Building</a><span class="prog" id="prog"></span></div>
<h1 id="title">Prop Deck</h1>
<div id="submitBox"></div>
<div id="card"></div>
<footer><a href="https://maxweberman.com">Built by Max Weberman</a></footer>
</div>
<script src="https://webermanapps.github.io/style-swipe/submit.js"></script>
<script>
const P=new URLSearchParams(location.search),ID=(P.get('d')||'prop-q1').replace(/[^a-z0-9-]/g,''),K='prop-deck-'+ID;
let D,st=JSON.parse(localStorage.getItem(K)||'{"a":{},"n":{},"s":{},"i":0}'),i=0;
const save=()=>localStorage.setItem(K,JSON.stringify(st)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL={properties:'Properties Deck','tenant-lease':'Tenant & Lease Deck',maintenance:'Maintenance & Contractors Deck',paperwork:'Paperwork & Moves Deck',dashboard:'Dashboard Deck'};
function results(){const answered=Object.keys(st.a).length;return{deck:ID,answers:st.a,notes:st.n,skipped:Object.keys(st.s),unanswered:D.cards.filter(c=>!st.a[c.id]&&!st.n[c.id]).map(c=>c.id),answered,total:D.cards.length,test:P.has('test')}}
function draw(){if(!D.cards.length)return;const c=D.cards[i];document.getElementById('prog').textContent=`Card ${i+1} of ${D.cards.length} · ${Object.keys(st.a).length} answered`;
 document.getElementById('card').innerHTML=`<div class="card"><div class="cat">${esc(CL[c.cat]||c.cat)}</div><h2>${esc(c.q)}</h2><div class="opts">${c.options.map((o,j)=>`<button type="button" data-o="${j}" class="${st.a[c.id]===o?'on':''}">${esc(o)}</button>`).join('')}</div>
 <textarea id="note" placeholder="Notes (optional)">${esc(st.n[c.id]||'')}</textarea><div class="nav"><button type="button" id="prev">Back</button><button type="button" id="skip">Skip</button><button type="button" id="next">Next</button></div></div>`;
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{st.a[c.id]=c.options[b.dataset.o];delete st.s[c.id];save();go(1)});
 const n=document.getElementById('note');n.oninput=()=>{n.value.trim()?st.n[c.id]=n.value:delete st.n[c.id];save()};
 document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
 document.getElementById('skip').onclick=()=>{if(!st.a[c.id])st.s[c.id]=1;save();go(1)}}
function go(d){i=(i+d+D.cards.length)%D.cards.length;st.i=i;save();draw()}
fetch(ID+'.json?v='+Date.now()).then(r=>r.json()).then(j=>{D=j;st.done=st.done||{};D.cards=D.cards.filter(c=>!st.done[c.id]);
 if(!D.cards.length){document.getElementById('card').innerHTML='<div class="card"><h2>All Done</h2><p>Every card is answered. A fresh deck will be ready on the dashboard.</p></div>';}
 document.getElementById('title').textContent=D.name;i=Math.min(st.i||0,Math.max(0,D.cards.length-1));if(D.cards.length)draw();
 const sb=document.getElementById('submitBox');sb.innerHTML='<button type="button" id="sub">Submit</button><div id="sst" role="status" aria-live="polite" style="margin-top:6px;color:#555;font-size:14px"></div>';
 const btn=document.getElementById('sub'),ss=document.getElementById('sst');
 btn.onclick=async()=>{const r=results();if(!r.answered&&!Object.keys(st.n).length){ss.textContent='Answer or note at least one card first.';return}
  btn.disabled=true;ss.textContent='Sending…';let ok=false;
  try{ok=await MWSubmit.send({agent:'prop',app:'prop-deck',deck:ID+(P.has('test')?'-test':''),results:r,notes:Object.entries(st.n).map(([k,v])=>k+': '+v).join('\n'),partial:r.unanswered.length>0,answered:r.answered,total:r.total,unanswered:r.unanswered,test:r.test})}catch(e){ok=false}
  btn.disabled=false;
  if(ok===true){D.cards.forEach(c=>{if(st.a[c.id]||st.n[c.id])st.done[c.id]=1});save();ss.textContent='Sent. Answered cards drop; skipped ones return reworded in the next ready deck.';D.cards=D.cards.filter(c=>!st.done[c.id]);i=0;D.cards.length?draw():document.getElementById('card').innerHTML='<div class="card"><h2>All Done</h2><p>A fresh 20-card deck in the same categories will be set as Ready on the dashboard.</p><p><a class="back" href="../#deck-launcher">Back to Deck Building</a></p></div>'}
  else ss.textContent=(window.MWSubmit&&MWSubmit.blocked)?'Not sent: password needed. Your answers are kept.':'Not sent yet. Your answers are kept and will retry.'};
});
</script></body></html>
